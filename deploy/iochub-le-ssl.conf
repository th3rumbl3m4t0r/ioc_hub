# IoCHub — HTTPS vhost (port 443), Let's Encrypt terminated by Apache.
#
# Apache is a pure TLS-terminating reverse proxy: it forwards EVERYTHING to the
# local IoCHub backend, which serves both the static frontend and the API. This
# keeps the SELinux story trivial (only the httpd_can_network_connect boolean,
# set by deploy.sh) — no DocumentRoot file-context labeling is needed.
#
# Cert paths and the ServerName below are substituted by deploy.sh
# (IOCHUB_SERVER_NAME / IOCHUB_CERT_DIR). They default to the certbot layout:
#   /etc/letsencrypt/live/<ServerName>/{fullchain,privkey}.pem
#
# Client IP / token binding: mod_proxy_http appends the direct client IP to
# X-Forwarded-For, which is how IoCHub binds tokens to a source IP. If you put
# another proxy/CDN (e.g. Zscaler) in front, configure mod_remoteip so the real
# client IP is first in X-Forwarded-For.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName IOCHUB_SERVER_NAME

    SSLCertificateFile      IOCHUB_CERT_DIR/fullchain.pem
    SSLCertificateKeyFile   IOCHUB_CERT_DIR/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security headers. Frontend is fully same-origin + vendored (no CDN), and
    # all VirusTotal traffic is same-origin via the backend relay, so the CSP
    # can be strict.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    # CSP is strict for everything EXCEPT the on-demand report extractor, which
    # is loaded into the page only when the operator opens the report pane and
    # deliberately pulls PDF.js / Mammoth / Tesseract (incl. WASM + a worker)
    # from cdnjs. Those CDN origins are allowed for scripts/workers/connect so
    # report upload works; if cdnjs is blocked only report upload is affected.
    # All other directives stay locked to 'self'.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; worker-src 'self' blob:; connect-src 'self' https://cdnjs.cloudflare.com https://tessdata.projectnaptha.com blob: data:; img-src 'self' data: blob:; style-src 'self'; base-uri 'self'; frame-ancestors 'none'"
    # NOTE: MISP enrichment queries go directly from the browser to your MISP
    # instance, so its origin must be added to connect-src above before MISP
    # enrichment will work, e.g. append  https://misp.example.org  to the
    # connect-src list (and reload httpd). No MISP host is allowed by default.

    # Forward everything to the backend on loopback (it serves the SPA + API).
    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8787/  timeout=120
    ProxyPassReverse /  http://127.0.0.1:8787/

    ErrorLog  /var/log/httpd/iochub_error.log
    CustomLog /var/log/httpd/iochub_access.log combined
</VirtualHost>
</IfModule>
