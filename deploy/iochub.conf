# IoCHub — HTTP vhost (port 80): redirect everything to HTTPS.
# Mirrors the certbot-style redirect vhost. ServerName is substituted by
# deploy.sh (IOCHUB_SERVER_NAME).
<VirtualHost *:80>
    ServerName IOCHUB_SERVER_NAME
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/httpd/iochub_error.log
    CustomLog /var/log/httpd/iochub_access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =IOCHUB_SERVER_NAME
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
